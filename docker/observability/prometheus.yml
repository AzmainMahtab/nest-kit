global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The API container, by its compose service name. Both stacks name it `api`,
  # so this works against `make dev` and `make prod` unchanged.
  - job_name: nest-kit-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]
        labels:
          service: nest-kit

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
