name: nest-kit

# Base stack with production-safe defaults: no database ports published to the
# host, production build target, restart policies on. Overlay a target file:
#   development -> docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   production  -> docker compose -f docker-compose.yml -f docker-compose.prod.yml up
# The Makefile wraps both (`make dev` / `make prod`).

services:
  postgres:
    image: postgres:18.4-alpine
    container_name: nest-kit-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      # Postgres 18+ declares its VOLUME at /var/lib/postgresql and sets
      # PGDATA to the version-scoped /var/lib/postgresql/18/docker. Mounting
      # the parent (not PGDATA itself, and not the pre-18 /data path) is what
      # upstream documents: it avoids a stray anonymous volume and lets a
      # future major upgrade use pg_upgrade --link across version subdirs.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.10-alpine
    container_name: nest-kit-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nats:
    image: nats:2.14.4-alpine
    container_name: nest-kit-nats
    # JetStream is what makes delivery durable; without -js the outbox relay
    # would publish into a fire-and-forget core-NATS subject.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: nest-kit-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Creates the bucket and exits. A one-shot job rather than a step in the
  # API's start-up: provisioning a bucket on every boot is the same mistake as
  # seeding on every boot, and every replica would race to do it.
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: nest-kit-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-nest-kit}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      echo 'bucket ready: '$$S3_BUCKET
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-production}
    image: nest-kit-api:${IMAGE_TAG:-latest}
    container_name: nest-kit-api
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-appdb}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      API_PREFIX: ${API_PREFIX:-api}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Inside the compose network the store is reachable by service name; a
      # presigned URL, however, is opened by a browser on the host, which is
      # why S3_PUBLIC_ENDPOINT exists separately.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-nest-kit}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      # /health/ready, not /health: compose gates dependent containers on this,
      # and "the process started" is not the same as "it can serve". Both are
      # excluded from API_PREFIX and unversioned, so neither probe moves when
      # the prefix or the API version changes.
      #
      # It returns 503 only when Postgres or Redis is down. A NATS outage
      # reports `degraded` and still passes, because the outbox is designed to
      # absorb exactly that.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
