name: nest-kit

# Production overlay: pinned build target, bounded memory, and rotated logs so
# a long-running container cannot fill the host disk.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-1g}

  redis:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-512m}

  api:
    build:
      target: production
    environment:
      NODE_ENV: production
    volumes:
      # The ES256 keypair is mounted, never baked in: .dockerignore excludes
      # certs/ and *.pem because an image is a distributable artifact and a
      # private key inside one leaks with every copy of it. Read-only — the
      # application only ever reads these, and `make keygen` writes them on the
      # host. A real deployment substitutes a secret manager or a k8s secret
      # here; the contract is only that /app/certs exists at boot.
      - ./certs:/app/certs:ro
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-512m}
