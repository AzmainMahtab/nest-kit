name: nest-kit

# Development overlay: hot reload from the mounted source, an attachable
# debugger, and database ports published to the host for psql/redis-cli and
# GUI clients.

services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  api:
    build:
      target: development
    environment:
      NODE_ENV: development
    # --debug binds to 127.0.0.1 by default, which is unreachable from the
    # host; 0.0.0.0:9229 is what makes the published debug port usable.
    command: ["pnpm", "exec", "nest", "start", "--debug", "0.0.0.0:9229", "--watch"]
    volumes:
      - .:/app
      # Keeps the image's node_modules instead of letting the bind mount
      # shadow it with the host tree.
      - node_modules:/app/node_modules
    ports:
      - "${DEBUG_PORT:-9229}:9229"

volumes:
  node_modules:
