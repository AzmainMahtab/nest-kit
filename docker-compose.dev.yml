name: nest-kit

# Development overlay: hot reload from the mounted source, an attachable
# debugger, and database ports published to the host for psql/redis-cli and
# GUI clients.

services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  nats:
    ports:
      - "${NATS_PORT:-4222}:4222"
      # Monitoring endpoint: /healthz, /jsz, /varz.
      - "${NATS_MONITOR_PORT:-8222}:8222"

  api:
    build:
      target: development
    environment:
      NODE_ENV: development
      # pnpm 11 runs a deps-status check before `pnpm exec`. When the
      # node_modules volume is stale relative to the bind-mounted lockfile it
      # wants to purge and reinstall, prompts for confirmation, finds no TTY,
      # and the container crash-loops. CI=true makes it purge and heal instead.
      CI: "true"
    # Same verb as production. docker-entrypoint.sh branches on NODE_ENV and
    # starts the watcher with the debugger bound to 0.0.0.0:9229 here, and
    # `node dist/main` there — so `migrate` and `seed` also mean the same thing
    # in both stacks.
    command: ["serve"]
    volumes:
      - .:/app
      # Keeps the image's node_modules instead of letting the bind mount
      # shadow it with the host tree.
      - node_modules:/app/node_modules
    ports:
      - "${DEBUG_PORT:-9229}:9229"

volumes:
  node_modules:
